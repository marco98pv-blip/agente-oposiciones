name: Agente de Oposiciones

on:
  schedule:
    # 08:00 UTC = 09:00 Madrid (08:00 Canarias) | 13:00 UTC = 14:00 Madrid (13:00 Canarias)
    - cron: '0 8,13 * * 1,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar-oposiciones:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar agente de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python agente_oposiciones.py

      - name: Guardar historial de enlaces revisados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historial.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar historial de oposiciones"
          git push
